<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz từ vựng（言葉遊びゲーム）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=BIZ+UDPGothic:wght@400;700&family=Kosugi+Maru&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-bg: #ffe6ef;
    --pink-deep: #ff8fab;
    --pink-line: #e85d8a;
    --plum: #7a3b57;
    --blue-accent: #7fb3d5;
    --gold: #e0a63f;
    --card: #fffafc;
    --good: #3f9e5f;
    --bad:  #e0556b;
    --ink:  #3f2c34;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--pink-bg);
    background-image:
      radial-gradient(circle at 10% 8%, rgba(255,255,255,.65) 0, transparent 35%),
      radial-gradient(circle at 92% 92%, rgba(255,255,255,.55) 0, transparent 40%);
    font-family: 'Be Vietnam Pro', sans-serif;
    color: var(--ink);
    padding: 28px 16px 60px;
  }
  .jp{ font-family: 'BIZ UDPGothic', 'Kosugi Maru', sans-serif; }

  .wrap{max-width:640px;margin:0 auto;}
  header{text-align:center;margin-bottom:20px;}
  .eyebrow{
    font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--pink-line);font-weight:600;margin-bottom:6px;
  }
  h1{
    font-size:26px;margin:0 0 6px;color:var(--plum);font-weight:700;
  }
  h1 .jp{font-size:20px;font-weight:700;color:var(--pink-line);}
  .sub{font-size:14px;color:#8a5c72;}

  .progress-track{
    height:7px;background:#ffd2e2;border-radius:6px;overflow:hidden;margin:18px 0 6px;
  }
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--pink-line),var(--gold));width:0%;transition:width .35s ease;}
  .score-row{display:flex;justify-content:space-between;font-size:12.5px;color:#8a5c72;margin-bottom:18px;font-weight:600;}

  .card{
    background:var(--card);
    border:2px solid #ffd2e2;
    border-radius:22px;
    padding:26px 22px 22px;
    box-shadow:0 12px 26px -16px rgba(232,93,138,.45);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;top:-34px;right:-34px;width:120px;height:120px;
    background:radial-gradient(circle, rgba(255,143,171,.30), transparent 70%);
  }
  .card::after{
    content:"";position:absolute;bottom:-30px;left:-30px;width:100px;height:100px;
    background:radial-gradient(circle, rgba(127,179,213,.20), transparent 70%);
  }
  .qnum{
    font-size:12.5px;color:var(--gold);font-weight:700;letter-spacing:.06em;margin-bottom:10px;
  }
  .tag{
    display:inline-block;margin-left:8px;padding:2px 9px;border-radius:999px;
    background:#ffe1ec;color:var(--pink-line);font-size:11px;font-weight:700;
    letter-spacing:.03em;vertical-align:middle;
  }
  .icon-stage{
    display:flex;align-items:center;justify-content:center;
    height:104px;font-size:58px;margin-bottom:12px;
  }
  .icon-stage svg{width:88px;height:88px;}
  .icon-stage img{max-height:100px;max-width:150px;object-fit:contain;}
  .prompt{
    text-align:center;font-size:14.5px;color:#8a5c72;margin-bottom:6px;font-weight:500;
  }
  .word-example{
    text-align:center;font-size:26px;font-weight:700;color:var(--plum);
    margin:2px 0 18px;letter-spacing:.02em;line-height:1.35;
  }
  .word-example.is-jp{font-size:30px;}
  .word-example .blank{
    display:inline-block;min-width:44px;border-bottom:3px solid var(--pink-line);
    margin:0 2px;
  }

  .choices{display:grid;gap:10px;position:relative;z-index:1;}
  .choices.grid-2{grid-template-columns:1fr 1fr;}
  .choice-btn{
    text-align:left;
    padding:12px 16px;
    border-radius:14px;
    border:1.5px solid #f3c3d6;
    background:#fffdfb;
    font-family:'Be Vietnam Pro',sans-serif;
    font-size:14.5px;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .choice-btn.jp{font-family:'BIZ UDPGothic','Kosugi Maru',sans-serif;font-size:16px;}
  .choice-btn.centered{text-align:center;font-size:19px;}
  .choice-btn:hover{border-color:var(--pink-line);transform:translateY(-1px);}
  .choice-btn.correct{
    background:#e9f7ed;border-color:var(--good);color:var(--good);font-weight:700;
  }
  .choice-btn.wrong{
    background:#fdecef;border-color:var(--bad);color:var(--bad);
  }
  .choice-btn[disabled]{cursor:default;}
  .choice-btn:not(.correct):not(.wrong)[disabled]{opacity:.5;}

  .explain{
    margin-top:14px;padding:12px 14px;border-radius:12px;
    background:#fff1f6;font-size:13.5px;line-height:1.55;color:#7a4a5c;
    display:none;position:relative;z-index:1;
    border:1px dashed #f3c3d6;
  }
  .explain.show{display:block;}
  .explain b{color:var(--pink-line);}
  .explain .jp{color:var(--plum);}

  .nav-row{display:flex;justify-content:flex-end;margin-top:18px;position:relative;z-index:1;}
  .next-btn{
    background:var(--pink-line);color:#fff;border:none;border-radius:999px;
    padding:10px 22px;font-size:14px;font-weight:700;cursor:pointer;
    font-family:'Be Vietnam Pro',sans-serif;
    opacity:0;pointer-events:none;transition:opacity .2s ease, background .15s ease;
  }
  .next-btn.show{opacity:1;pointer-events:auto;}
  .next-btn:hover{background:var(--plum);}

  .result{text-align:center;padding:40px 20px;}
  .result .big{font-size:44px;color:var(--pink-line);margin-bottom:6px;font-weight:700;}
  .result p{color:#8a5c72;font-size:14px;}
  .restart-btn{
    margin-top:18px;background:var(--blue-accent);color:#fff;border:none;
    border-radius:999px;padding:11px 26px;font-size:14px;font-weight:700;
    cursor:pointer;font-family:'Be Vietnam Pro',sans-serif;
  }
  .hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">みんなの日本語 ・ Bài 22</div>
    <h1>Quiz từ vựng <span class="jp">（言葉遊びゲーム）</span></h1>
    <div class="sub">Bài 22 ・ みんなの日本語</div>
  </header>

  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="score-row">
    <span id="qCounter">Câu 1 / 13</span>
    <span id="scoreLabel">Điểm: 0</span>
  </div>

  <div class="card" id="quizCard">
    <div class="qnum" id="qnum">問 01<span class="tag hidden" id="qtag"></span></div>
    <div class="icon-stage" id="icon"></div>
    <div class="prompt" id="promptText"></div>
    <div class="word-example" id="wordExample"></div>
    <div class="choices" id="choices"></div>
    <div class="explain" id="explain"></div>
    <div class="nav-row"><button class="next-btn" id="nextBtn">Câu tiếp →</button></div>
  </div>

  <div class="card result hidden" id="resultCard">
    <div class="big" id="finalScore"></div>
    <p>Bạn đã hoàn thành quiz từ vựng Bài 22!</p>
    <button class="restart-btn" id="restartBtn">Làm lại từ đầu</button>
  </div>
</div>

  { icon:"👔", isSvg:false, isVerb:true, jp:"します「ネクタイを～」", vn:"Đeo (cà vạt)",
    note:"ネクタイをします = thắt/đeo cà vạt." },
  { icon:"🧥", isSvg:false, jp:"コート", vn:"Áo khoác (áo choàng)",
    note:"コート = áo khoác ngoài dày, mặc khi trời lạnh." },
  { icon: SWEATER_IMG, isImage:true, jp:"セーター", vn:"Áo len",
    note:"セーター (sweater) = áo len, thường mặc bên trong áo khoác." },
  { icon:"🕴️", isSvg:false, jp:"スーツ", vn:"Com-lê, bộ vest",
    note:"スーツ (suit) = bộ com-lê / vest thường mặc đi làm." },
  { icon:"🍰", isSvg:false, jp:"ケーキ", vn:"Bánh ngọt",
    note:"ケーキ (cake) = bánh ngọt." },
  { icon:"🍱", isSvg:false, jp:"「お」べんとう", vn:"Cơm hộp",
    note:"「お」べんとう = cơm hộp, お là tiền tố lịch sự đứng trước danh từ." },
  { icon: hatSVG, isSvg:true, jp:"ぼうし", vn:"Mũ, nón",
    note:"ぼうし là danh từ chỉ cái mũ/nón, đi cùng động từ かぶります." },
  { icon: HUMOR_IMG, isImage:true, jp:"ユーモア", vn:"Sự hài hước, khiếu hài hước",
    note:"ユーモア (humor) = sự hài hước, khiếu hài hước của một người." }
];

// ---- Grammar fill-in-the-blank question(s) ----
const grammarQuestions = [
  { icon: BABY2_IMG, isImage:true,
    before:"こども", after:"うまれます。",
    promptText:"Chọn trợ từ đúng vào chỗ trống",
    options:["が","を","に","で"],
    correct:"が",
    jpFull:"こどもがうまれます。",
    vn:"Con (tôi) được sinh ra.",
    note:"うまれます là động từ tự động (không có tác nhân tác động), nên chủ thể đi với trợ từ が, không phải を." }
];

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// Build meaning-matching questions, alternating jp->vn / vn->jp
function buildMeaningQuestions(){
  return words.map((w, idx) => {
    const dir = idx % 2 === 0 ? 'jp2vn' : 'vn2jp';
    const sourcePool = w.isVerb
      ? words.filter(x => x.isVerb && x !== w)
      : words.filter(x => !x.isVerb && x !== w);

    // Verb + has a real illustration + Japanese-text direction:
    // show the picture only, answer choices are Japanese verb phrases.
    const hasIllustration = w.isImage || w.isSvg;
    if(w.isVerb && dir === 'jp2vn' && hasIllustration){
      const correct = w.jp;
      const distractors = shuffle(sourcePool.map(x => x.jp)).slice(0,3);
      const choices = shuffle([correct, ...distractors]);
      return {
        type:'meaning',
        icon: w.icon, isSvg: w.isSvg, isImage: w.isImage,
        exampleText: '', exampleIsJp: false,
        choices, correct, choiceIsJp: true,
        note: w.note, jp: w.jp, vn: w.vn,
        promptText: ""
      };
    }

    const field = dir === 'jp2vn' ? 'vn' : 'jp';
    const correct = w[field];
    const distractors = shuffle(sourcePool.map(x => x[field])).slice(0,3);
    const choices = shuffle([correct, ...distractors]);
    return {
      type:'meaning',
      icon: w.icon, isSvg: w.isSvg, isImage: w.isImage,
      exampleText: dir === 'jp2vn' ? w.jp : w.vn,
      exampleIsJp: dir === 'jp2vn',
      choices, correct, choiceIsJp: dir === 'vn2jp',
      note: w.note, jp: w.jp, vn: w.vn,
      promptText: ""
    };
  });
}

function buildGrammarQuestions(){
  return grammarQuestions.map(g => ({
    type:'grammar',
    icon: g.icon, isSvg: g.isSvg, isImage: g.isImage,
    before: g.before, after: g.after,
    choices: shuffle(g.options), correct: g.correct,
    choiceIsJp:true,
    promptText: g.promptText,
    note: g.note, jp: g.jpFull, vn: g.vn
  }));
}

function buildQuestions(){
  return shuffle([...buildMeaningQuestions(), ...buildGrammarQuestions()]);
}

let questions = buildQuestions();
let current = 0;
let score = 0;
let answered = false;

const qnumEl = document.getElementById('qnum');
const qtagEl = document.getElementById('qtag');
const iconEl = document.getElementById('icon');
const promptEl = document.getElementById('promptText');
const exampleEl = document.getElementById('wordExample');
const choicesEl = document.getElementById('choices');
const explainEl = document.getElementById('explain');
const nextBtn = document.getElementById('nextBtn');
const progressFill = document.getElementById('progressFill');
const qCounter = document.getElementById('qCounter');
const scoreLabel = document.getElementById('scoreLabel');
const quizCard = document.getElementById('quizCard');
const resultCard = document.getElementById('resultCard');

function loadQuestion(){
  answered = false;
  const q = questions[current];

  qnumEl.childNodes[0].nodeValue = "問 " + String(current+1).padStart(2,'0') + " ";
  if(q.type === 'grammar'){
    qtagEl.textContent = "NGỮ PHÁP";
    qtagEl.classList.remove('hidden');
  } else {
    qtagEl.classList.add('hidden');
  }

  if(q.isImage){ iconEl.innerHTML = '<img src="' + q.icon + '" alt="">'; }
  else if(q.isSvg){ iconEl.innerHTML = q.icon; }
  else { iconEl.textContent = q.icon; }

  promptEl.textContent = q.promptText;
  promptEl.style.display = q.promptText ? '' : 'none';

  if(q.type === 'grammar'){
    exampleEl.className = 'word-example is-jp jp';
    exampleEl.innerHTML = q.before + '<span class="blank">＿＿＿</span>' + q.after;
    exampleEl.style.display = '';
  } else {
    exampleEl.className = 'word-example' + (q.exampleIsJp ? ' is-jp jp' : '');
    exampleEl.textContent = q.exampleText;
    exampleEl.style.display = q.exampleText ? '' : 'none';
  }

  explainEl.classList.remove('show');
  explainEl.innerHTML = '';
  nextBtn.classList.remove('show');
  qCounter.textContent = `Câu ${current+1} / ${questions.length}`;
  scoreLabel.textContent = `Điểm: ${score}`;
  progressFill.style.width = (current/questions.length*100) + '%';

  choicesEl.innerHTML = '';
  choicesEl.className = 'choices' + (q.type === 'grammar' ? ' grid-2' : '');
  q.choices.forEach(choice => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn' + (q.choiceIsJp ? ' jp' : '') + (q.type === 'grammar' ? ' centered' : '');
    btn.textContent = choice;
    btn.addEventListener('click', () => selectAnswer(btn, choice, q));
    choicesEl.appendChild(btn);
  });
}

function selectAnswer(btn, choice, q){
  if(answered) return;
  answered = true;
  const allBtns = choicesEl.querySelectorAll('.choice-btn');
  allBtns.forEach(b => {
    b.disabled = true;
    if(b.textContent === q.correct) b.classList.add('correct');
  });
  if(choice !== q.correct){
    btn.classList.add('wrong');
  } else {
    score++;
  }
  explainEl.innerHTML = `<b>Đáp án:</b> <span class="jp">${q.jp}</span> — ${q.vn}. ${q.note}`;
  explainEl.classList.add('show');
  scoreLabel.textContent = `Điểm: ${score}`;
  nextBtn.classList.add('show');
}

nextBtn.addEventListener('click', () => {
  current++;
  if(current < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
});

function showResult(){
  progressFill.style.width = '100%';
  quizCard.classList.add('hidden');
  resultCard.classList.remove('hidden');
  document.getElementById('finalScore').textContent = `${score} / ${questions.length}`;
}

document.getElementById('restartBtn').addEventListener('click', () => {
  questions = buildQuestions();
  current = 0; score = 0;
  resultCard.classList.add('hidden');
  quizCard.classList.remove('hidden');
  loadQuestion();
});

loadQuestion();
</script>
</body>
</html>
